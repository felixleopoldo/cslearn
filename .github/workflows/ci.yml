name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (graphviz for pygraphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev pkg-config
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,expt]'
      - name: Lint with ruff
        run: ruff check src tests
      - name: Run tests (docstring examples included via tests/test_docstrings.py)
        run: pytest tests/
