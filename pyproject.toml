[project]
name = "cstrees"
version = "1.3.1"
description = "A Python library for CStrees."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0.0",
    "networkx",
    "matplotlib",
    "pygraphviz",
    "pandas",
    "tqdm",
    "causal-learn",
    "scipy",
    "pydot",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "manuel",
    "pylint",
    "sphinx",
    "ipython",
    "ipykernel",
    "mpl-tools",
    "pp-ez",
]
expt = [
    "seaborn",
    "pgmpy",
    "causaldag",
    "p_tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cstrees"]
