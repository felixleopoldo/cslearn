[project]
name = "cslearn"
version = "1.3.1"
description = "A Python library for CStrees."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0.0",
    "networkx",
    "matplotlib",
    "pygraphviz",
    "pandas",
    "tqdm",
    "causal-learn",
    "scipy",
    "pydot",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "manuel",
    "pylint",
    "sphinx",
    "ipython",
    "ipykernel",
    "mpl-tools",
    "pp-ez",
]
expt = [
    "seaborn",
    "pgmpy",
    "causaldag",
    "p_tqdm",
    "scikit-learn",
    "ucimlrepo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cslearn"]

[dependency-groups]
dev = [
    "bibtexparser>=1.4.4",
    "nbsphinx>=0.9.8",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "documentation: marks tests that run docstring examples via manuel",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741", "E501"]  # l/O/I conventional in scientific code; long docstrings/URLs are fine

[tool.ruff.lint.per-file-ignores]
# snakemake injects the `snakemake` object at runtime; F821 is a false positive
"src/expt/workflow/scripts/*.py" = ["F821"]
