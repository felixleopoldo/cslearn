[project]
name = "cslearn"
version = "1.3.1"
description = "A Python library for CStrees."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0.0",
    "networkx",
    "pygraphviz",
    "pandas",
    "tqdm",
    "causal-learn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "sphinx",
    "ipython",
    "ipykernel",
    "pikepdf>=10.12.0",
]
expt = [
    "matplotlib",
    "seaborn",
    "pgmpy",
    "causaldag",
    "p_tqdm",
    "scikit-learn",
    "ucimlrepo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cslearn"]

[dependency-groups]
dev = [
    "bibtexparser>=1.4.4",
    "build>=1.2",
    "nbsphinx>=0.9.8",
    "snakefmt>=0.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
    "twine>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "documentation: marks tests that run docstring / README code examples",
]

[tool.ruff]
line-length = 120
# notebooks are demo/exploratory code; docs/ is Sphinx config. Lint the
# importable package and its tests.
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741", "E501"]  # l/O/I conventional in scientific code; long docstrings/URLs are fine

[tool.ruff.lint.per-file-ignores]
# snakemake injects the `snakemake` object at runtime; F821 is a false positive
"src/expt/workflow/scripts/*.py" = ["F821"]
